<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Graphite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Graphite</title>
<style>
/* "Midnight" glass, same system as Views Tracker. Layout: sticky top bar (app switcher · title · settings), app tabs, scrolling view. */
:root{
  --text:#f5f5f7; --text2:rgba(235,235,245,.66); --text3:rgba(235,235,245,.38);
  --accent:#0a84ff; --accent-ink:#9ccaff; --green:#6ff08c; --red:#ff8a80; --gold:#ffc56b; --mint:#8ef5a5;
  --glass:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --rim-a:rgba(255,255,255,.36); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --inner-top:rgba(255,255,255,.2); --shadow:0 10px 30px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.16);
  --chip:rgba(255,255,255,.08); --chip-border:rgba(255,255,255,.14); --row-hover:rgba(255,255,255,.06);
  --spring:cubic-bezier(.3,1.3,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --bg-a:#060d24; --bg-b:#0d2259; --bg-c:#1b4fb8; --c1:#2f80ff; --c2:#22d3ee; --c3:#1e3a8a;
  --bar-a:rgba(30,48,100,.82); --bar-b:rgba(14,26,62,.82); --pop-a:rgba(32,50,104,.96); --pop-b:rgba(14,24,58,.96); --sh-a:rgba(28,44,92,.97); --sh-b:rgba(12,22,52,.97); --toast:rgba(20,34,72,.95);
  color-scheme:dark;
}
[data-wp="obsidian"]{--bg-a:#030304;--bg-b:#0c0d11;--bg-c:#1d1f27;--c1:#4b5063;--c2:#8a8fa3;--c3:#23252f;--bar-a:rgba(40,42,52,.84);--bar-b:rgba(17,18,23,.84);--pop-a:rgba(42,44,54,.97);--pop-b:rgba(16,17,22,.97);--sh-a:rgba(38,40,50,.98);--sh-b:rgba(14,15,20,.98);--toast:rgba(32,34,42,.96)}
[data-wp="forest"]{--bg-a:#02120b;--bg-b:#07301d;--bg-c:#0f7a49;--c1:#22c55e;--c2:#a3e635;--c3:#065f46;--bar-a:rgba(22,72,48,.84);--bar-b:rgba(8,34,22,.84);--pop-a:rgba(24,76,50,.97);--pop-b:rgba(8,32,21,.97);--sh-a:rgba(20,66,44,.98);--sh-b:rgba(7,28,19,.98);--toast:rgba(14,52,34,.96)}
[data-wp="violet"]{--bg-a:#0b0520;--bg-b:#261055;--bg-c:#6a2bd4;--c1:#a855f7;--c2:#ec4899;--c3:#4c1d95;--bar-a:rgba(58,30,110,.84);--bar-b:rgba(24,12,52,.84);--pop-a:rgba(60,32,114,.97);--pop-b:rgba(22,11,48,.97);--sh-a:rgba(52,28,100,.98);--sh-b:rgba(20,10,44,.98);--toast:rgba(40,20,80,.96)}
[data-wp="sunset"]{--bg-a:#16060d;--bg-b:#46102c;--bg-c:#c2410c;--c1:#f97316;--c2:#f43f5e;--c3:#7c2d12;--bar-a:rgba(96,30,50,.84);--bar-b:rgba(40,10,22,.84);--pop-a:rgba(100,32,52,.97);--pop-b:rgba(38,10,20,.97);--sh-a:rgba(88,28,46,.98);--sh-b:rgba(34,9,18,.98);--toast:rgba(70,22,36,.96)}
[data-wp="ocean"]{--bg-a:#02161c;--bg-b:#063d4a;--bg-c:#0e7490;--c1:#06b6d4;--c2:#34d399;--c3:#155e75;--bar-a:rgba(14,74,90,.84);--bar-b:rgba(5,34,42,.84);--pop-a:rgba(16,78,94,.97);--pop-b:rgba(5,32,40,.97);--sh-a:rgba(14,68,82,.98);--sh-b:rgba(4,28,35,.98);--toast:rgba(10,54,66,.96)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg-a)}
body{min-height:100vh;color:var(--text);background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 50%,var(--bg-c) 100%) fixed;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.t{display:inline-block;line-height:1.2;text-box:trim-both cap alphabetic;white-space:nowrap}

.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%}
.b1{background:radial-gradient(closest-side,var(--c1),transparent);width:70vmax;height:70vmax;left:-24vmax;bottom:-26vmax;opacity:.55}
.b2{background:radial-gradient(closest-side,var(--c2),transparent);width:56vmax;height:56vmax;right:-18vmax;top:-22vmax;opacity:.4}
.b3{background:radial-gradient(closest-side,var(--c3),transparent);width:60vmax;height:60vmax;left:24vmax;top:4vmax;opacity:.45}
body::before{content:"";position:fixed;z-index:15;left:0;right:0;top:0;height:env(safe-area-inset-top);pointer-events:none;background:linear-gradient(180deg,var(--bg-a) 0%,var(--bg-a) 70%,transparent 100%)}

.glass{position:relative;background:var(--glass);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 1px var(--inner-top);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,var(--rim-a),var(--rim-b) 38%,var(--rim-b) 62%,var(--rim-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- top bar */
.top{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:10;display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;margin-bottom:12px;
  --glass:linear-gradient(140deg,var(--bar-a),var(--bar-b))}
.appbtn{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;transition:background .2s}
.appbtn:hover{background:var(--row-hover)}
.appbtn:active{transform:scale(.97)}
.appbtn .name{font-weight:700;font-size:16px;letter-spacing:-.2px}
.appbtn .chev{width:14px;height:14px;opacity:.7;transition:transform .3s var(--spring)}
.appbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.aicon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:16px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.3)}
.aicon svg{width:19px;height:19px}
.ic-moneta{background:linear-gradient(145deg,#4ade80,#10b981 55%,#0ea5a4)}
.ic-english{background:linear-gradient(145deg,#c084fc,#8b5cf6 55%,#6366f1)}
.ic-views{background:linear-gradient(145deg,#5ac8fa,#0a84ff 55%,#5e5ce6)}
.sp{flex:1}
.round{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-border);box-shadow:inset 0 1px 0 var(--inner-top);transition:transform .15s,background .15s}
.round:hover{background:rgba(255,255,255,.16)} .round:active{transform:scale(.92)}
.round svg{width:17px;height:17px}

.menu{position:fixed;z-index:30;left:max(12px,calc(50% - 368px));top:calc(env(safe-area-inset-top) + 66px);width:min(320px,calc(100vw - 24px));padding:8px;border-radius:24px;
  --glass:linear-gradient(140deg,var(--pop-a),var(--pop-b));transform-origin:24px 0;animation:drop .32s var(--spring) both}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:30px;height:30px;border-radius:9px;background:#000;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand .lg svg{width:20px;height:20px}.brand b{font-size:16px;font-weight:750;letter-spacing:-.2px}.brand small{margin-left:auto;font-size:11px;color:var(--text3)}
.mi .aicon.gear{background:var(--chip);box-shadow:inset 0 0 0 1px var(--chip-border)}.mi .aicon.gear svg{width:18px;height:18px}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wp{display:flex;flex-direction:column;gap:7px;align-items:stretch;text-align:center;font-size:12.5px;font-weight:600;color:var(--text2)}
.wp i{display:block;aspect-ratio:9/13;border-radius:16px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .2s var(--spring),box-shadow .2s}
.wp i::after{content:"";position:absolute;left:12%;right:12%;top:12%;height:13%;border-radius:999px;background:rgba(255,255,255,.14)}
.wp i::before{content:"";position:absolute;left:12%;right:12%;top:31%;height:24%;border-radius:12px;background:rgba(255,255,255,.1)}
.wp:active i{transform:scale(.95)}.wp.on{color:var(--text)}.wp.on i{box-shadow:0 0 0 2px var(--text),0 0 0 4px rgba(255,255,255,.18)}
.menu.closing{animation:lift .16s ease forwards}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes lift{to{opacity:0;transform:translateY(-6px) scale(.96)}}
.menu h4{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);padding:8px 12px 6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:16px;transition:background .15s;animation:pop .4s var(--spring) both;animation-delay:calc(var(--i,0)*40ms + 40ms)}
.mi:hover{background:var(--row-hover)} .mi.on{background:rgba(10,132,255,.22)}
.mi b{display:block;font-size:14.5px} .mi small{display:block;font-size:12px;color:var(--text2)}
.mi .tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text2)}
.mi[disabled]{opacity:.55;cursor:default}
.scrim{position:fixed;inset:0;z-index:25}

/* ---------- common */
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.view{animation:fadeIn .3s var(--ease) both}
.stagger>*{animation:pop .42s var(--spring) both;animation-delay:calc(var(--i,0)*30ms)}
.stagger>.glass{animation-name:fadeIn}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.22);gap:2px;isolation:isolate}
.seg button{position:relative;z-index:1;flex:1;display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text2);transition:color .25s;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;z-index:0;left:0;width:0;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 1px 0 var(--inner-top);transition:transform .38s var(--spring),width .38s var(--spring)}
.tabs{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;background:var(--chip);border:1px solid var(--chip-border);
  box-shadow:inset 0 1px 0 var(--inner-top);transition:transform .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.4;pointer-events:none}
.btn.blue{background:var(--accent);color:#fff;border-color:transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 4px 14px rgba(10,132,255,.35)}
.btn.green{background:linear-gradient(180deg,#34d07a,#10a95e);color:#fff;border-color:transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 4px 14px rgba(16,169,94,.35)}
.btn.danger{color:var(--red)}
.btn.wide{width:100%}
.btn svg{width:16px;height:16px;flex:none}
.card{padding:16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-h h3,.lbl{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}
.card-h .note{font-size:12px;color:var(--text3);margin-left:auto;text-align:right}
.muted{color:var(--text2);font-size:13px;line-height:1.45}
.dim{color:var(--text3)}

/* month switcher */
.month{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.month .label{flex:1;text-align:center;font-weight:700;font-size:17px;letter-spacing:-.2px}
.month .label small{display:block;font-size:11.5px;font-weight:500;color:var(--text2);letter-spacing:0}

/* hero */
.hero{padding:20px 18px 18px;margin-bottom:12px;overflow:hidden}
.hero .lbl{margin-bottom:6px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .sub{margin-top:6px;color:var(--text2);font-size:13.5px}
.hero .sub b{color:var(--text);font-weight:600}
.hero .glow{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(74,222,128,.35),transparent);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{padding:13px 14px;border-radius:20px}
.tile .k{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
.tile .v{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .d{font-size:11.5px;color:var(--text3);margin-top:2px;white-space:nowrap}
.up{color:var(--green)} .down{color:var(--red)}

/* bars chart */
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:18px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#4ade80,#10b981);transform-origin:bottom;animation:grow .6s var(--spring) both;animation-delay:calc(var(--i)*12ms)}
.bars .b i.zero{background:rgba(255,255,255,.1);height:3px!important}
.bars .b i.today{background:linear-gradient(180deg,#9ccaff,#0a84ff)}
.bars .b span{font-size:9px;color:var(--text3);height:11px}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;width:100%;text-align:left;transition:background .15s}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.row:hover{background:var(--row-hover)}
.row .day{width:42px;height:42px;border-radius:13px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(74,222,128,.16);color:var(--mint);line-height:1}
.row .day b{font-size:16px} .row .day small{font-size:9.5px;font-weight:700;text-transform:uppercase;margin-top:2px;opacity:.85}
.row .day.pay{background:rgba(10,132,255,.2);color:var(--accent-ink)}
.row .day.hol{background:rgba(255,197,107,.18);color:var(--gold)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600}
.row .tx small{display:block;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row .amt small{display:block;font-size:11.5px;font-weight:500;color:var(--text3)}
.empty{text-align:center;padding:26px 10px;color:var(--text2)}
.empty .big{font-size:34px;margin-bottom:6px}

.notice{padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;margin-bottom:12px}
.notice.ok{background:rgba(52,199,89,.16);color:#c9f7d4}
.notice.bad{background:rgba(255,69,58,.16);color:#ffd1cc}
.notice.info{background:rgba(10,132,255,.16);color:#d3e7ff}
.notice b{color:#fff}
.payday{display:flex;align-items:center;gap:14px}
.payday .cd{width:62px;height:62px;border-radius:20px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,132,255,.2);color:var(--accent-ink)}
.payday .cd b{font-size:24px;line-height:1;color:#fff} .payday .cd small{font-size:10px;font-weight:700;text-transform:uppercase;margin-top:3px}
.meter{height:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffc56b,#ff9f0a);transition:width .8s var(--ease)}

.fab{position:fixed;z-index:9;right:max(16px,calc(50% - 364px));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#34d07a,#10a95e);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 26px rgba(16,169,94,.45);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.92)} .fab svg{width:26px;height:26px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:10px;background:rgba(2,6,20,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadeIn .2s ease both}
.overlay.closing{animation:fadeOut .18s ease forwards}
.overlay.closing .sheet{animation:sink .18s ease forwards}
@keyframes fadeOut{to{opacity:0}} @keyframes sink{to{opacity:0;transform:translateY(14px)}}
.sheet{width:min(560px,100%);max-height:calc(100vh - 20px - env(safe-area-inset-top));overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:28px;
  --glass:linear-gradient(140deg,var(--sh-a),var(--sh-b));animation:rise .34s var(--spring) both}
@media (min-width:700px){.overlay{align-items:center}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:19px;font-weight:700;flex:1}
.x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-border);transition:transform .2s}
.x:hover{transform:rotate(90deg)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--text2);min-width:0}
.f input,.f select{width:100%;min-width:0;height:44px;border-radius:13px;border:1px solid var(--chip-border);background:rgba(0,0,0,.25);padding:0 12px;outline:0;font-size:16px;font-weight:500;color:var(--text);-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus{border-color:rgba(100,176,255,.6)}
.f input[type=date],.f input[type=time],.f input[type=month]{display:flex;align-items:center}
.f select option{background:#14244f}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-border);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .15s,background .15s}
.otg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 0}.otg>div{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:3px;min-width:0}.otg small{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;opacity:.6}.otg b{font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.otg b.g{color:var(--green,#4ade80)}.otg span{font-size:11.5px;opacity:.6}
i.ot{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;background:rgba(251,191,36,.2);color:#fbbf24;margin-right:2px}
.chip.ghost{background:transparent;border-style:dashed;color:var(--mut,rgba(255,255,255,.7))}

async function apify(path, opt = {}) {

  M.deleted = del;

    const map = new Map(M[coll].map(x => [x.id, x]));
    for (const x of R[coll] || []) { const l = map.get(x.id); if (del[x.id]) continue; if (!l || (x.at || 0) > (l.at || 0)) { map.set(x.id, x); ch = true; } }

  }

}

  try { const id = await kvId(); await apify(`/key-value-stores/${id}/records/${KV_KEY}`, { method: "PUT", body }); lastPushed = body; M.meta.syncAt = now(); M.meta.syncErr = null; }

  const o = sheet(sheetHead(isNew ? "Log payout" : "Edit payout") + `
    <div class="seg" id="pType" style="margin-bottom:12px">${[["salary", "Salary"], ["holiday", "Holiday pay"], ["bonus", "Bonus"]].map(([k, l]) => `<button data-k="${k}" class="${p.type === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="fields"><label class="f">Received on<input type="date" id="pDate" value="${esc(p.date)}"></label><label class="f" id="pForWrap">For month<input type="month" id="pFor" value="${esc(p.forMonth || "")}"></label></div>
    <div class="fields"><label class="f">Landed on account (net)<input type="text" id="pNet" inputmode="decimal" placeholder="0.00" value="${p.net === "" ? "" : num(p.net)}"></label><label class="f">Gross from payslip (optional)<input type="text" id="pGross" inputmode="decimal" placeholder="for exact check" value="${p.gross ? num(p.gross) : ""}"></label></div>
    <div class="preview" id="pPrev" style="background:rgba(10,132,255,.14)"></div>
    <div class="acts">${isNew ? "" : '<button class="btn danger" id="pDel">Delete</button>'}<button class="btn blue" id="pOk">${isNew ? "Save payout" : "Save changes"}</button></div>`);
  const type = () => o.querySelector("#pType .on").dataset.k;
  const prev = () => {
    const t = type(); o.querySelector("#pForWrap").hidden = t !== "salary";
    const el = o.querySelector("#pPrev"); const k = o.querySelector("#pFor").value;
    if (t === "salary" && k) { const md = monthData(k); el.hidden = false; el.innerHTML = `<span>Expected for ${esc(mShort(k))}<br><small class="dim">${md.sh.length} shifts · ${hrs(md.hours)} · ${money(md.gross)} gross</small></span><b style="color:var(--accent-ink)">≈ ${money(md.net)}</b>`; }
    else if (t === "holiday") { el.hidden = false; el.innerHTML = `<span>Saved up so far</span><b style="color:var(--gold)">${money(holidayAccrued())}</b>`; }
    else el.hidden = true;
  };
  o.querySelector("#pType").onclick = e => { const b = e.target.closest("button"); if (b) { segSet(o.querySelector("#pType"), b.dataset.k); prev(); } };
  o.querySelectorAll("input").forEach(i => i.addEventListener("input", prev)); prev();
  o.querySelector("#pOk").onclick = () => {
    const net = num(o.querySelector("#pNet").value); if (!(net > 0)) return toast("Enter the amount you received");
    const t = type(); const x = { ...p, type: t, date: o.querySelector("#pDate").value || today(), net: r2(net), gross: r2(num(o.querySelector("#pGross").value)) || 0, forMonth: t === "salary" ? o.querySelector("#pFor").value : "" };
    upsert("pays", x); closeSheet(o);
    if (t === "salary" && x.forMonth) { const md = monthData(x.forMonth); const df = x.net - md.net; toast(md.net ? (Math.abs(df) <= Math.max(5, md.net * .03) ? "Saved · matches your shifts ✓" : `Saved · ${df > 0 ? "+" : "−"}${money(Math.abs(df))} vs expected`) : "Payout saved"); } else toast("Payout saved");
  };
  const del = o.querySelector("#pDel"); if (del) del.onclick = () => { closeSheet(o); remove("pays", p.id); };
}
function openMSettings() {
  const d = clone(MS()); d.surcharges = d.surcharges || []; d.presets = d.presets || []; d.otDays = d.otDays || [];
  const vtTok = (() => { try { return !!JSON.parse(localStorage.getItem("vtmac.v1") || "null")?.settings?.token; } catch (e) { return false; } })();
  const o = sheet(sheetHead("Moneta settings") + `<div id="sBody"></div><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn green" id="stOk">Save</button></div>`);
  const draw = () => {
    o.querySelector("#sBody").innerHTML = `
    <div class="sec"><h4>Pay</h4><div class="fields"><label class="f">Hourly rate, gross<input id="stRate" inputmode="decimal" value="${num(d.rate)}"></label><label class="f">Take-home, % of gross<input id="stNet" type="number" min="1" max="100" value="${num(d.netPct)}"></label><label class="f">Currency<input id="stCur" maxlength="3" value="${esc(d.currency)}"></label></div>
      <div class="fields"><label class="f">Payday (day of month)<input id="stDay" type="number" min="1" max="31" value="${num(d.payDay)}"></label><label class="f">Salary arrives for<select id="stFor"><option value="prev" ${d.payFor !== "same" ? "selected" : ""}>previous month</option><option value="same" ${d.payFor === "same" ? "selected" : ""}>the same month</option></select></label></div>
      <p>Take-home % is how much of gross reaches your account after tax (≈88% for you). Check it against a payslip once.</p></div>
    <div class="sec"><h4>Holiday pay</h4><div class="fields"><label class="f">% of gross<input id="stHol" type="number" step="0.01" value="${num(d.holidayPct)}"></label><label class="f">Already saved up<input id="stHolS" inputmode="decimal" value="${num(d.holidayStart)}"></label></div><p>“Already saved up” is the amount on your last payslip before you started logging shifts here.</p></div>
    <div class="sec"><h4>Overtime</h4><p>Shifts on these days count as overtime. Their pay is taxed harder, so a lower take-home % is used for them.</p>
      <div class="days">${DOW_ORDER.map(w => `<button data-oday="${w}" class="${d.otDays.includes(w) ? "on" : ""}">${DOW[w].slice(0, 2)}</button>`).join("")}</div>
      <div class="fields" style="margin-top:10px"><label class="f">Take-home on overtime, %<input id="stOtNet" type="number" min="1" max="100" value="${num(d.otNetPct)}"></label></div><p>Extra % for overtime hours (e.g. Sat +50%, Sun +100%) is set in Premiums below.</p></div>
    <div class="sec"><h4>Premiums</h4><p>Extra pay for evenings, nights or weekends. They stack.</p>${d.surcharges.map((r, i) => `<div class="prem"><div class="top2"><label class="f">Name<input data-p="name" data-i="${i}" value="${esc(r.name)}"></label><label class="f">+ %<input data-p="pct" data-i="${i}" type="number" value="${num(r.pct)}"></label><button class="x" data-pdel="${i}" aria-label="Remove">✕</button></div>
      <div class="days">${DOW_ORDER.map(w => `<button data-pday="${i}" data-d="${w}" class="${(r.days || []).includes(w) ? "on" : ""}">${DOW[w].slice(0, 2)}</button>`).join("")}</div>
      <div class="fields" style="margin:0"><label class="f">From<input type="time" data-p="from" data-i="${i}" value="${esc(r.from)}"></label><label class="f">To<input type="time" data-p="to" data-i="${i}" value="${esc(r.to === "24:00" ? "00:00" : r.to)}"></label></div></div>`).join("")}<button class="btn" id="pAdd">+ Add premium</button></div>
    <div class="sec"><h4>Shift presets</h4><p>Quick buttons at the top of “Add shift”.</p>${d.presets.map((r, i) => `<div class="prem"><div class="fields" style="margin:0;grid-template-columns:1fr 1fr 64px 32px;gap:8px;align-items:end"><label class="f">Start<input type="time" data-q="start" data-i="${i}" value="${esc(r.start)}"></label><label class="f">End<input type="time" data-q="end" data-i="${i}" value="${esc(r.end)}"></label><label class="f">Break<input type="number" min="0" data-q="brk" data-i="${i}" value="${num(r.brk)}"></label><button class="x" data-qdel="${i}" aria-label="Remove">✕</button></div></div>`).join("")}<button class="btn" id="qAdd">+ Add preset</button></div>
    <div class="sec"><h4>Sync phone ↔ Mac</h4><div class="switchrow"><span>Sync through Apify<small>${vtTok && !d.token ? "uses the token from Views Tracker" : "stored in your Apify (store “daily-apps”)"}</small></span><input type="checkbox" class="switch" id="stSync" ${d.sync !== false ? "checked" : ""}></div>
      <div class="fields" style="margin-top:8px"><label class="f">Apify token ${vtTok ? "(optional — Views Tracker's is used)" : ""}<input id="stTok" type="password" placeholder="apify_api_…" value="${esc(d.token || "")}"></label></div></div>
    <div class="sec"><h4>Backup</h4><p>Export a file now and then. Import also accepts a backup from the old Moneta artifact (shifts and income).</p><div class="acts"><button class="btn" id="stExp">Export</button><button class="btn" id="stImp">Import</button></div></div>`;
    o.querySelectorAll("[data-p]").forEach(inp => inp.oninput = () => { const r = d.surcharges[+inp.dataset.i]; r[inp.dataset.p] = inp.dataset.p === "pct" ? num(inp.value) : inp.value; });
    o.querySelectorAll("[data-pday]").forEach(b => b.onclick = () => { const r = d.surcharges[+b.dataset.pday], w = +b.dataset.d; r.days = r.days || []; r.days = r.days.includes(w) ? r.days.filter(x => x !== w) : [...r.days, w]; b.classList.toggle("on"); });
    o.querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => { keep(); d.surcharges.splice(+b.dataset.pdel, 1); draw(); });
    o.querySelector("#pAdd").onclick = () => { keep(); d.surcharges.push({ name: "Evening", pct: 25, days: [1, 2, 3, 4, 5], from: "20:00", to: "24:00" }); draw(); };
    o.querySelectorAll("[data-oday]").forEach(b => b.onclick = () => { const w = +b.dataset.oday; d.otDays = d.otDays.includes(w) ? d.otDays.filter(x => x !== w) : [...d.otDays, w]; b.classList.toggle("on"); });
    o.querySelectorAll("[data-q]").forEach(inp => inp.oninput = () => { const r = d.presets[+inp.dataset.i]; r[inp.dataset.q] = inp.dataset.q === "brk" ? Math.max(0, num(inp.value)) : inp.value; });
    o.querySelectorAll("[data-qdel]").forEach(b => b.onclick = () => { keep(); d.presets.splice(+b.dataset.qdel, 1); draw(); });
    o.querySelector("#qAdd").onclick = () => { keep(); d.presets.push({ start: "08:00", end: "17:00", brk: 60 }); draw(); };
    o.querySelector("#stExp").onclick = exportM; o.querySelector("#stImp").onclick = () => importM(o);
  };
  const keep = () => { const v = id => o.querySelector(id).value; Object.assign(d, { rate: r2(num(v("#stRate"))), netPct: Math.min(100, Math.max(1, num(v("#stNet")) || 88)), currency: v("#stCur").trim() || "€", payDay: Math.min(31, Math.max(1, num(v("#stDay")) || 25)), payFor: v("#stFor"), holidayPct: Math.max(0, num(v("#stHol"))), holidayStart: r2(Math.max(0, num(v("#stHolS")))), sync: o.querySelector("#stSync").checked, otNetPct: Math.min(100, Math.max(1, num(v("#stOtNet")) || 55)), token: v("#stTok").trim() }); };
  draw();
  o.querySelector("#stOk").onclick = () => { keep(); M.settings = { ...MDEF, ...d }; M.settingsAt = now(); mSave(); closeSheet(o); render(); if (syncOn()) pull(true); toast("Settings saved"); };
}
function exportM() {
  const txt = JSON.stringify({ ...M, settings: { ...MS(), token: undefined } }, null, 1);
  const u = URL.createObjectURL(new Blob([txt], { type: "application/json" })); const a = Object.assign(document.createElement("a"), { href: u, download: `moneta-${today()}.json` }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function importM(o) {
  const i = Object.assign(document.createElement("input"), { type: "file", accept: ".json,application/json" });
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); let shifts = d.shifts || [], pays = d.pays || [];
      if (d.tx && !d.pays) pays = d.tx.filter(t => t.kind === "inc" && (t.type === "salary" || t.type === "holiday")).map(t => ({ id: t.id || rid(), type: t.type, date: t.date, net: num(t.amount), gross: num(t.gross) || 0, forMonth: t.forMonth || "" }));
      if (!Array.isArray(shifts)) throw new Error("not a Moneta backup");
      const known = new Set(M.shifts.map(s => s.id)); let n = 0;
      for (const s of shifts) if (s && s.date && !known.has(s.id)) { M.shifts.push({ id: s.id || rid(), date: s.date, start: s.start, end: s.end, brk: num(s.brk), note: s.note || "", at: now() }); n++; }
      const kp = new Set(M.pays.map(p => p.id)); let m = 0; for (const p of pays) if (!kp.has(p.id)) { M.pays.push({ ...p, at: now() }); m++; }
      if (d.settings) { const keepTok = MS().token; M.settings = { ...MDEF, ...MS(), ...Object.fromEntries(Object.entries(d.settings).filter(([k]) => k in MDEF && k !== "token")), token: keepTok }; M.settingsAt = now(); }
      mSave(); closeSheet(o); render(); toast(`Imported ${n} shifts and ${m} payouts`);
    } catch (e) { toast("✕ " + e.message); }
  };
  i.click();
}

/* ================= events ================= */
$("#main").addEventListener("click", e => {
  const t = e.target.closest("#mtabs button"); if (t) { mv.tab = t.dataset.k; segSet($("#mtabs"), mv.tab); setTimeout(() => render(true), 0); return; }
  const m = e.target.closest("[data-m]"); if (m) { mv.month = mAdd(mv.month, +m.dataset.m); render(true); return; }
  const s = e.target.closest("[data-shift]"); if (s) return shiftSheet(M.shifts.find(x => x.id === s.dataset.shift));
  const p = e.target.closest("[data-pay]"); if (p) return paySheet(M.pays.find(x => x.id === p.dataset.pay));
  if (e.target.closest("#fab")) return mv.tab === "pay" ? paySheet() : shiftSheet();
});
$("#setBtn").onclick = () => openMSettings();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => segPills(), 120); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(true); });
if (document.fonts) document.fonts.ready.then(() => segPills());
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
renderShell(); render(true); pull(true);
</script>
